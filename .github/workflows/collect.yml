name: Collect sources

on:
  schedule:
    # 06:00 JST
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect source facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect.mjs
      - name: Commit raw data and seen state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git add -- raw/ state/
          if git diff --cached --quiet; then
            echo 'No new source data.'
            exit 0
          fi
          git commit -m "data: collect $(TZ=Asia/Tokyo date +%F)"
          git push origin HEAD:main
