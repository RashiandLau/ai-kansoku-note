name: Validate and publish

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'raw/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      notify_date:
        description: 'Published issue date to notify (YYYY-MM-DD, optional)'
        required: false
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Execute only the base revision's validator. The PR checkout supplies data,
      # never executable scripts, dependencies, package hooks, or workflow code.
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate data at the event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scope and validate the daily data
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr diff "$PR_NUMBER" --name-only > "$RUNNER_TEMP/changed-files.txt"
          # The API can return a newer head. Compare its names with the immutable
          # event diff, then pin the merge to the head whose data we validated.
          git -C candidate diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" > "$RUNNER_TEMP/event-changed-files.txt"
          diff -u <(LC_ALL=C sort "$RUNNER_TEMP/changed-files.txt") <(LC_ALL=C sort "$RUNNER_TEMP/event-changed-files.txt")
          # Only same-date Japanese and English data regular files are allowed;
          # trusted code also checks their parent directories for symlinks.
          node trusted/scripts/validate.mjs --changed-files --root candidate < "$RUNNER_TEMP/changed-files.txt"
          # Read facts directly from trusted base; candidate raw is never used.
          issue_date="$(node trusted/scripts/validate-writer-pr.mjs --base-root trusted --root candidate < "$RUNNER_TEMP/changed-files.txt")"
          echo "date=$issue_date" >> "$GITHUB_OUTPUT"
      - name: Merge the validated head and dispatch publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          ISSUE_DATE: ${{ steps.issue.outputs.date }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$EXPECTED_HEAD"
          # GITHUB_TOKEN merges do not trigger push workflows. Dispatch a fresh
          # run on main so Pages does not receive the PR merge ref.
          gh workflow run publish.yml --ref main -f "notify_date=$ISSUE_DATE"

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # PR merges dispatch a separate workflow run on main for publication.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the site
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify registered readers
        if: inputs.notify_date != ''
        continue-on-error: true
        shell: bash
        env:
          NOTIFY_DATE: ${{ inputs.notify_date }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: |
          if [[ ! "$NOTIFY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'Skipping notification: invalid date format.'
            exit 0
          fi
          npm ci --omit=dev
          node scripts/notify.mjs --date "$NOTIFY_DATE"
